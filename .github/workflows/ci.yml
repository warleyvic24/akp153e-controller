name: CI

on:
  push:
    branches: [main, linux-port]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Testes (hook de guarda)
        run: node --test "tests/**/*.test.js"
      - name: Instalar cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Auditoria de dependências
        run: cargo audit

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config fonts-dejavu-core libudev-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev
      - name: Instalador (sintaxe)
        run: sh -n packaging/linux/install.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: akp153e-linux
          path: target/release/akp153e
