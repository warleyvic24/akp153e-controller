name: CI

on:
  push:
    branches: [main, linux-port]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Testes (hook de guarda)
        run: node --test "tests/**/*.test.js"
      - name: Instalar cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licenças, avisos de segurança (com as exceções justificadas em deny.toml) e origem das crates.
      - name: Dependências (cargo deny)
        run: cargo deny check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config fonts-dejavu-core libudev-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev
      - name: Instalador (sintaxe)
        run: sh -n packaging/linux/install.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Cobertura de linhas (73% em 2026-10-31): o piso impede que ela caia sem ninguém perceber.
      - name: Cobertura
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --summary-only --fail-under-lines 70
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: keyforge-linux
          path: target/release/keyforge
