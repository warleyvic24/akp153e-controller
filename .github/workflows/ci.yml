name: CI

on:
  push:
    branches: [main, linux-port]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Testes (hook de guarda)
        run: node --test "tests/**/*.test.js"
      - name: Instalar cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Licenças, avisos de segurança (com as exceções justificadas em deny.toml) e origem das crates.
      - name: Dependências (cargo deny)
        run: cargo deny check

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config fonts-dejavu-core libudev-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            xvfb imagemagick
      - name: Instalador (sintaxe)
        run: sh -n packaging/linux/install.sh
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (Rust)
        run: cargo test
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Cobertura de linhas (73% em 2026-10-31): o piso impede que ela caia sem ninguém perceber.
      - name: Cobertura
        run: |
          rustup component add llvm-tools-preview
          cargo llvm-cov --summary-only --fail-under-lines 70
      - name: Build release
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: keyforge-linux
          path: target/release/keyforge

  ui-regressao:
    runs-on: ubuntu-latest
    needs: [linux]
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config fonts-dejavu-core libudev-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxdo-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcb1-dev \
            xvfb imagemagick
      - name: Build debug
        run: cargo build
      - name: Criar cópia de config para capturas
        run: |
          mkdir -p /tmp/ui-config
          cp -r target/debug/build/*/out/* /tmp/ui-config/ 2>/dev/null || true
          # Cria um config.json mínimo se não existir
          if [ ! -f /tmp/ui-config/config.json ]; then
            echo '{}' > /tmp/ui-config/config.json
          fi
      - name: Capturar telas (atual)
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          sh tools/ui-shots.sh /tmp/ui-capturas /tmp/ui-config
      - name: Comparar com baseline
        run: |
          python3 tools/ui-diff.py /tmp/ui-capturas docs/ui-baseline || true
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-capturas
          path: /tmp/ui-capturas

  # ============================================================
  # Windows release: gera .exe e .msi nas tags
  # ============================================================
  windows-release:
    name: Windows Release (.exe + .msi)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Dependências do sistema (Windows)
        run: |
          # winresource e outras já vêm com o Rust/MSVC no GitHub Actions
          choco install nsis --no-progress || true
      - name: Build Windows release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Testes Windows
        run: cargo test --target x86_64-pc-windows-msvc
      - name: Instalar cargo-winstaller
        run: cargo install cargo-winstaller
      - name: Build instalador MSI
        run: cargo wininstaller --config windows/wininstaller.toml
      - name: Upload .exe
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.release.upload_url }}
          asset_path: target/x86_64-pc-windows-msvc/release/keyforge.exe
          asset_name: keyforge-x86_64-pc-windows-msvc.exe
          asset_content_type: application/vnd.microsoft.portable-executable
      - name: Upload .msi
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ github.release.upload_url }}
          asset_path: keyforge-setup-${{ github.ref_name }}.msi
          asset_name: keyforge-setup-${{ github.ref_name }}.msi
          asset_content_type: application/x-msi
      - name: Criar release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Keyforge ${{ github.ref_name }}
          body: |
            ## Keyforge ${{ github.ref_name }}
            
            ## Baixe para Windows
            - [keyforge-x86_64-pc-windows-msvc.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/keyforge-x86_64-pc-windows-msvc.exe)
            - [keyforge-setup-${{ github.ref_name }}.msi](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/keyforge-setup-${{ github.ref_name }}.msi)
            
            ## Instalação
            1. Baixe o `.msi` e execute como administrador
            2. Instale o driver USB do AKP153E (WinUSB ou libusbK) se usar o aparelho
            3. O ícone estará na bandeja do sistema e no Menu Iniciar
            
            ## ⚠️ Aviso
            Build gerado automaticamente no GitHub Actions (Windows). Não testado com hardware físico no Windows.
        draft: false
        prerelease: false
