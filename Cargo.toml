[package]
name = "akp153e"
description = "Open-source replacement for the AJAZZ AKP153E stream controller app"
license = "MIT"
repository = "https://github.com/warleyvic24/akp153e-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
hidapi = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
directories = "5"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
tray-icon = "0.19"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
