[package]
name = "akp153e"
description = "Unofficial open-source controller software for the AJAZZ AKP153E stream controller"
license = "MIT"
repository = "https://github.com/warleyvic24/akp153e-controller"
version = "0.1.0"
edition = "2021"
# `File::lock` (trava da config entre editor e serviço).
rust-version = "1.89"

[dependencies]
eframe = "0.29"
egui = "0.29"
hidapi = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
# Ícones em SVG (temas de ícones do Linux e favicons de sites) viram PNG para a tecla.
resvg = "0.45"
ab_glyph = "0.2"
tray-icon = "0.26"
rfd = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# A bandeja do Linux (tray-icon) precisa do laço de eventos do GTK na mesma thread.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# Sem `wayland` o enigo só fala com o X11 (XWayland) e as teclas simuladas não chegam aos apps
# nativos do Wayland, como no Hyprland do Omarchy. O protocolo de teclado virtual resolve.
enigo = { version = "0.6", features = ["wayland"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
