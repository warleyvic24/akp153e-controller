[package]
name = "akp153e"
description = "Unofficial open-source controller software for the AJAZZ AKP153E stream controller"
license = "MIT"
repository = "https://github.com/warleyvic24/akp153e-controller"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.29"
hidapi = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
directories = "6"
log = "0.4"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
tray-icon = "0.26"
rfd = "0.17"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"
