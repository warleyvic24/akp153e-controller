<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente sutil para o fundo -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <!-- Clipping para cantos arredondados transparentes -->
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="512" height="512" rx="64"/>
    </clipPath>

    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brilho externo -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow das teclas -->
    <filter id="keyGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brilho superior -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Brilho direito -->
    <linearGradient id="rightGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e90ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e90ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fundo com gradiente sutil (verdadeiramente preto) -->
  <rect width="512" height="512" fill="url(#bgGradient)" clip-path="url(#roundedClip)"/>

  <!-- Sombra do quadrado principal -->
  <rect x="40" y="40" width="432" height="432" rx="48" fill="#000000" filter="url(#shadow)" clip-path="url(#roundedClip)"/>

  <!-- Quadrado principal (aparelho) -->
  <rect x="40" y="40" width="432" height="432" rx="48" fill="#050507" stroke="#1a1a1e" stroke-width="2"/>

  <!-- Bezel/embutido interno -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="none" stroke="#222228" stroke-width="1"/>

  <!-- Título da marca "KF" no canto superior esquerdo -->
  <text x="110" y="140" font-family="monospace" font-size="96" font-weight="bold" fill="#e0e0e0" letter-spacing="-4">KF</text>
  <text x="110" y="140" font-family="monospace" font-size="96" font-weight="bold" fill="none" stroke="#1e90ff" stroke-width="1.5" letter-spacing="-4">KF</text>

  <!-- Grade 3x5 de teclas (representando o AKP153E) -->
  <!-- Layout: 3 colunas, 5 linhas -->
  <g transform="translate(140, 200)">
    <!-- Linha 1 -->
    <rect x="0" y="0" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <circle cx="40" cy="40" r="16" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>

    <rect x="100" y="0" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M140 20 L160 40 L140 60 L140 20 Z" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>

    <rect x="200" y="0" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M240 20 L260 40 L240 60" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

    <!-- Linha 2 -->
    <rect x="0" y="100" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M20 130 L20 160 L40 145 L20 130 Z" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>

    <rect x="100" y="100" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <rect x="130" y="130" width="20" height="20" rx="4" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>

    <rect x="200" y="100" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <text x="240" y="148" font-family="monospace" font-size="28" font-weight="bold" fill="#1e90ff" text-anchor="middle">←</text>

    <!-- Linha 3 -->
    <rect x="0" y="200" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M20 240 M40 240 M60 240" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

    <rect x="100" y="200" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <circle cx="140" cy="240" r="18" fill="#ff4757" opacity="0.95" filter="url(#glow)"/>
    <circle cx="140" cy="240" r="8" fill="#ffffff" opacity="0.9"/>

    <rect x="200" y="200" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M220 220 L260 240 L220 260" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

    <!-- Linha 4 -->
    <rect x="0" y="300" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M40 320 M40 360" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>

    <rect x="100" y="300" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M130 330 L150 350 L170 330" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
    <circle cx="140" cy="340" r="4" fill="#1e90ff"/>

    <rect x="200" y="300" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M230 340 L250 320 L250 360 L230 340 Z" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>

    <!-- Linha 5 -->
    <rect x="0" y="400" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <circle cx="40" cy="440" r="6" fill="#1e90ff" opacity="0.95" filter="url(#glow)"/>
    <circle cx="40" cy="440" r="12" fill="none" stroke="#1e90ff" stroke-width="2" opacity="0.6"/>

    <rect x="100" y="400" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M130 430 L150 450 L170 430" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
    <circle cx="140" cy="440" r="3" fill="#1e90ff"/>

    <rect x="200" y="400" width="80" height="80" rx="10" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1" filter="url(#keyGlow)"/>
    <path d="M220 420 L260 440 L220 460" stroke="#1e90ff" stroke-width="4" stroke-linecap="round" opacity="0.95" filter="url(#glow)"/>
  </g>

  <!-- Faixa lateral direita (side screen do AKP153E) -->
  <rect x="410" y="140" width="56" height="232" rx="16" fill="#050507" stroke="#1a1a1e" stroke-width="1"/>
  <rect x="422" y="152" width="32" height="32" rx="6" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1"/>
  <path d="M438 168 L446 176 L454 168" stroke="#1e90ff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <rect x="422" y="200" width="32" height="32" rx="6" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1"/>
  <path d="M430 216 L446 232 L462 216" stroke="#1e90ff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <rect x="422" y="248" width="32" height="32" rx="6" fill="#0a0a0c" stroke="#1a1a1e" stroke-width="1"/>
  <path d="M430 264 L430 280 M440 264 L440 280 M450 264 L450 280" stroke="#1e90ff" stroke-width="2" opacity="0.9"/>

  <!-- Brilho superior sutil -->
  <rect x="40" y="40" width="432" height="60" rx="48" fill="none" stroke="url(#topGlow)" stroke-width="1"/>

  <!-- Brilho no lado direito -->
  <rect x="456" y="40" width="16" height="432" rx="16" fill="none" stroke="url(#rightGlow)" stroke-width="2"/>

  <!-- Rótulo "KEYFORGE" discreto na parte inferior -->
  <text x="256" y="470" font-family="sans-serif" font-size="20" font-weight="600" fill="#8a8a92" text-anchor="middle" letter-spacing="2">KEYFORGE</text>
</svg>